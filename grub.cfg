# A short menu so a failed boot on real hardware is visible rather than a
# black flash. On success it boots in 3 seconds.
set timeout=3
set default=0

insmod vbe
insmod vga
insmod all_video

menuentry "xyuOS Neo" {
    # Try progressively safer video modes. The kernel reads whatever resolution
    # GRUB actually set from the multiboot2 framebuffer tag and adapts to it, so
    # any of these works -- the point of the list is just to succeed SOMEWHERE
    # on a monitor that rejects 1080p.
    set gfxpayload=1920x1080x32,1280x1024x32,1280x720x32,1024x768x32,800x600x32,auto

    multiboot2 /boot/xyuos_neo.elf

    # The filesystem image, loaded as a RAM disk. On bare metal there is no
    # virtio-blk and we have no AHCI/NVMe driver, so this is the ONLY disk; in
    # QEMU with a -drive, virtio wins and this is just a harmless fallback.
    # Writes live in RAM only and vanish on reboot -- which is exactly why the
    # OS can never touch the machine's real disk.
    module2 /boot/disk.img disk

    boot
}
