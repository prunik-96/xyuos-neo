# A short menu so a failed boot on real hardware is visible rather than a
# black flash. On success it boots in 3 seconds.
set timeout=3
set default=0

insmod vbe
insmod vga
insmod all_video
insmod ext2
insmod regexp

# @DISKID@ is replaced at build time with the UUID of the ext2 filesystem the
# build made (see the Makefile). The file in the repository is a template.

menuentry "xyuOS Neo" {
    # Try progressively safer video modes. The kernel reads whatever resolution
    # GRUB actually set from the multiboot2 framebuffer tag and adapts to it, so
    # any of these works -- the point of the list is just to succeed SOMEWHERE
    # on a monitor that rejects 1080p.
    set gfxpayload=1920x1080x32,1280x1024x32,1280x720x32,1024x768x32,800x600x32,auto

    multiboot2 /boot/xyuos_neo.elf

    # The disk is the ext2 partition the build appended to this very image.
    # On a stick written from it (Rufus, DD mode) that partition is on the
    # stick, and what is written there survives a reboot. The kernel finds it
    # by the UUID in diskid, and touches nothing else.
    module2 /boot/diskid diskid

    # Where there is no such partition the kernel can reach -- a stick a tool
    # filled with the ISO's files rather than the image, or the ISO booted as
    # a CD (QEMU's -cdrom) -- the image goes into memory instead, as it always
    # used to. Whether there is one is asked of the firmware's disks directly,
    # by UUID, not guessed from what GRUB calls the boot device: on a machine
    # with an internal disk the stick need not be hd0.
    #
    # A CD is the one catch: GRUB reads the partition table inside the ISO and
    # finds the partition there, but the kernel has no CD driver to follow it.
    # So a partition found on a CD does not count -- cdN under UEFI, hd96
    # under SeaBIOS, which is where QEMU puts a CD.
    set disk=memory
    if search --no-floppy --fs-uuid --set=stickdisk @DISKID@; then
        set disk=stick
        if regexp '^(cd|hd96)' "$stickdisk"; then set disk=memory; fi
    fi
    if [ "$disk" = memory ]; then
        module2 /boot/disk.img disk
    fi

    boot
}

# For when the stick's partition cannot be used: a USB controller the driver
# does not get on with, or a stick written by a tool that copied the files and
# not the image. The disk is loaded into memory, and writes last until the
# machine is switched off -- which is how it always was before.
menuentry "xyuOS Neo - disk in memory" {
    set gfxpayload=1920x1080x32,1280x1024x32,1280x720x32,1024x768x32,800x600x32,auto
    multiboot2 /boot/xyuos_neo.elf
    module2 /boot/disk.img disk
    boot
}
